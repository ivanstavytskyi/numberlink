# Internet → host 8090 → this container :80
# Then proxy to the two Compose services from the diagram.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:7000;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location /oauth2/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location /login/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location /uploads/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location = /nginx-health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        default_type text/plain;
        alias /usr/share/nginx/healthz;
    }

    location /actuator/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location /swagger-ui {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location /v3/api-docs {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://frontend;
    }
}
