AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC provider and IAM role. Deploy from the console once before any workflow can talk to AWS.

Parameters:
  GitHubOrg:
    Type: String
    Default: ivanstavytskyi
  GitHubRepo:
    Type: String
    Default: Numberlink
  Project:
    Type: String
    Default: numberlink

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 1b511abead59c6ce207077c0bf0e57d5c1cf7c8c

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-github-actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: terraform-and-bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationBootstrap
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: FirstRdsInAccount
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: rds.amazonaws.com
              - Sid: StateBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:ListBucket
                  - s3:PutBucket*
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketPolicy
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${Project}-tfstate-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${Project}-tfstate-${AWS::AccountId}/*"
              - Sid: TerraformStack
                Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Description: Put this in the GitHub Actions secret AWS_ROLE_ARN
