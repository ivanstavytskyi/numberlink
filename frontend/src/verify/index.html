<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NumberLink — Confirm email</title>
  <link rel="icon" type="image/svg+xml" href="/logo_white_theme.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/logo_dark_theme.svg" media="(prefers-color-scheme: dark)" />
  <style>
    @font-face {
      font-family: 'Nunito';
      src: url("/assets/fonts/Nunito/Nunito-VariableFont_wght.ttf");
      font-display: swap;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 76% 52% at 88% -12%, color-mix(in srgb, #0d9488 6%, transparent), transparent 58%),
        radial-gradient(ellipse 52% 44% at 6% 108%, color-mix(in srgb, #14b8a6 4%, transparent), transparent 54%),
        url("/topography.svg") 0 0 / 680px 680px,
        color-mix(in srgb, #f4f4f5 88%, #f0fdfa 12%);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #71717a;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>Confirming your email…</main>
  <script type="module" src="./main.js"></script>
</body>
</html>
