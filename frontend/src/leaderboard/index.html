<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NumberLink — Leaderboard</title>
    <link rel="icon" type="image/svg+xml" href="/logo_white_theme.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo_dark_theme.svg" media="(prefers-color-scheme: dark)" />

    <style>body{opacity:0;transition:opacity .22s ease}</style>
</head>

<body class="guest-locked">
    <header>
        <div class="header_container container-fluid d-flex flex-wrap justify-content-start align-items-center ">

            <a href="/" class="numberlink_nav text-decoration-none text-reset" aria-label="Home">
                <img class="header_logo" src="/logo.svg" width="32" height="32" alt="">
            </a>

            <a href="/" class="text-decoration-none text-reset">
                <nav class="home_nav" data-href="/">
                    Home
                </nav>
            </a>

            <a href="./" class="text-decoration-none text-reset">
                <nav class="nav-1 dashboard_nav" data-href="./">
                    Leaderboard
                </nav>
            </a>

            <a href="../reviews/" class="text-decoration-none text-reset">
                <nav class="reviews_nav" data-href="../reviews">
                    Reviews
                </nav>
            </a>

            <a href="../faqs/" class="text-decoration-none text-reset">
                <nav class="faqs_nav" data-href="../faqs">
                    FAQs
                </nav>
            </a>

            <a class="header_github" href="https://github.com/ivanstavytskyi/Numberlink" target="_blank" rel="noopener noreferrer" aria-label="NumberLink on GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                </svg>
            </a>

        </div>
    </header>

    <main>
        <div class="mt-4 container-fluid">
            <div class="row justify-content-center">
                <div class="leaderboard_head_wrap col-11 col-sm-9 col-md-8 col-lg-7 col-xl-6">
                    <div class="leaderboard_head_block">
                        <div class="leaderboard_heading_left_part">
                            <div class="leaderboard_text text-light mb-1">
                                Leaderboard<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-medal mr-2 h-4 w-4"
                                    aria-hidden="true" style="
                                        margin-left: 12px;
                                        margin-bottom: 5px;
                                    ">
                                    <path
                                        d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15">
                                    </path>
                                    <path d="M11 12 5.12 2.2"></path>
                                    <path d="m13 12 5.88-9.8"></path>
                                    <path d="M8 7h8"></path>
                                    <circle cx="12" cy="17" r="5"></circle>
                                    <path d="M12 18v-2h-.5"></path>
                                </svg>
                            </div>
                            <div class="leaderboard_head_description">
                                See who's leading the pack in our global quiz rankings.
                            </div>
                        </div>
                        <div class="leaderboard_period dropdown">
                            <span class="visually-hidden" id="leaderboard-period-label">Rankings period</span>
                            <button type="button"
                                class="btn dropdown-toggle leaderboard_period_select"
                                id="leaderboard-period"
                                data-bs-toggle="dropdown"
                                data-period="all-time"
                                aria-labelledby="leaderboard-period-label"
                                aria-expanded="false">
                                All Time
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end leaderboard_period_menu" aria-labelledby="leaderboard-period">
                                <li><a class="dropdown-item" href="#" data-value="week">Weekly</a></li>
                                <li><a class="dropdown-item" href="#" data-value="month">Monthly</a></li>
                                <li><a class="dropdown-item active" href="#" data-value="all-time">All Time</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <section id="main">
            <div class="mt-4 container-fluid">
                <div class="row justify-content-center flex-wrap leaderboard">
                    <div class="field_container col-12 col-sm-11 col-md-10 col-lg-9 col-xl-8 p-0 mb-4">

                        <div class="leaderboard_panel">
                            <div class="sort_panel d-flex justify-content-left flex-wrap gap-4">
                                <div class="sort_label">Sort by:</div>

                                <div class="dropdown sort_dropdown">
                                    <button class="btn dropdown-toggle sort_btn" type="button" id="map-sort-button"
                                        data-bs-toggle="dropdown">
                                        Map Size
                                    </button>
                                    <ul class="dropdown-menu sort_menu">
                                        <li><a class="dropdown-item" data-value="all">All Sizes</a></li>
                                        <li><a class="dropdown-item" data-value="7" data-size="7x7">7×7</a></li>
                                        <li><a class="dropdown-item" data-value="8" data-size="8x8">8×8</a></li>
                                        <li><a class="dropdown-item" data-value="9" data-size="9x9">9×9</a></li>
                                        <li><a class="dropdown-item" data-value="10" data-size="10x10">10×10</a></li>
                                        <li><a class="dropdown-item" data-value="11" data-size="11x11">11×11</a></li>
                                    </ul>

                                </div>

                                <button type="button" class="sort_btn no_hints" data-criterion="noHints">No hints</button>
                                <button type="button" class="sort_btn avg_time" data-criterion="avgElapsedSeconds">Average Time</button>
                                <button type="button" class="sort_btn avg_score" data-criterion="avgScore">Average Score</button>
                            </div>


                            <div
                                class="leaderboard_records row d-flex flex-column justify-content-center align-items-center">


                                <div class="leaderboard_item self">
                                    <div class="lb_content">
                                        <div class="lb_row">
                                            <span class="lb_medal self_medal" id="self_rank">—</span>
                                            <div class="lb_avatar" id="self_avatar"></div>
                                            <div class="lb_who">
                                                <div class="lb_name-1">You</div>
                                                <div class="lb_points-1" id="self_points_line">No score yet</div>
                                            </div>
                                            <div class="lb_self_badge">Your stats</div>
                                        </div>
                                        <div class="lb_stats">
                                            <div class="lb_stat_item-1">
                                                <span class="lb_stat_label-1">Avg Time:</span>
                                                <span class="lb_stat_value-1 time">—</span>
                                            </div>
                                            <div class="lb_stat_item-1">
                                                <span class="lb_stat_label-1">Avg Score:</span>
                                                <span class="lb_stat_value-1 score">—</span>
                                            </div>
                                            <div class="lb_hints" id="self_hints" hidden></div>
                                        </div>
                                    </div>
                                </div>
                                
                                
                            </div>


                        </div>

                    </div>

                    <div class="pagination_info">
                        <span class="pg_label">Showing</span>
                        <span class="pg_range">0</span>
                        <span class="pg_label">of</span>
                        <span class="pg_total">0</span>
                        <span class="pg_label">results</span>
                    </div>



                    <div class="pagination">
                        <button class="page_btn">‹</button>
                        <button class="page_btn active">1</button>
                        <button class="page_btn">2</button>
                        <button class="page_btn">3</button>
                        <button class="page_btn">›</button>
                    </div>

                </div>
            </div>

            </div>
        </section>
    </main>
    <script defer type="module" src="./main.js"></script>
</body>

</html>
