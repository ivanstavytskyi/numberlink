spring.devtools.restart.enabled=false
spring.application.name=numberlink
# backend exposed port
server.port=8000
# Trust Host / X-Forwarded-Proto from the compose nginx (and host TLS proxy).
server.forward-headers-strategy=framework

# database connectivity settings
spring.datasource.url = ${SPRING_DATASOURCE_URL}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}

# Hibernate will not change tables,
# instead it will verify the match between entity table structure,
# and sql table structure. If structure not matches the app won't start.
spring.jpa.hibernate.ddl-auto=validate
# The table scheme is changed by flyway-migrations, not by Hibernate.
spring.flyway.enabled=true
# If database exists, and there is no flyway history, then
# it will be marked as version 1, and further update only v2+ versions.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HTML mail is loaded from classpath:/mail, not Thymeleaf templates/
spring.thymeleaf.check-template-location=false

# OpenAPI / Swagger UI: http://localhost:8000/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Health check endpoint http://localhost:8000/actuator/health.
# It will come useful for Docker/AWS to check whether the service is alive.
management.endpoints.web.exposure.include=health
# In healt response, there will be shown details (as DB is up/down and etc.), not only general up/down.
management.endpoint.health.show-details=always

# Keys for Google OAuth app, Spring Security uses them
# to redirect on Google, change 'code' on tokens, to retrieve user profile data.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_BASE_URL}/login/oauth2/code/google

# The same keys, for the Github app.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${BACKEND_BASE_URL}/login/oauth2/code/github

# Where to send the browser after a successful OAuth login
app.oauth.success-redirect-url=${FRONTEND_BASE_URL:http://localhost:7000}/

# SMTP (transactional mail: verification, etc.)
# Port 587: SMTP_STARTTLS=true, SMTP_SSL=false
# Port 465: SMTP_STARTTLS=false, SMTP_SSL=true
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${SMTP_USERNAME}}
app.mail.from-name=${MAIL_FROM_NAME:NumberLink}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:7000}
app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8000}
app.mail.verify-token-ttl=${MAIL_VERIFY_TOKEN_TTL:48h}
app.mail.reset-token-ttl=${MAIL_RESET_TOKEN_TTL:2h}
app.mail.email-change-ttl=${MAIL_EMAIL_CHANGE_TTL:15m}
app.mail.email-change-resend-cooldown=${MAIL_EMAIL_CHANGE_RESEND_COOLDOWN:60s}

# Profile avatars (local disk)
app.uploads.dir=${UPLOADS_DIR:uploads}
app.avatar.max-bytes=${AVATAR_MAX_BYTES:7340032}
spring.servlet.multipart.max-file-size=7MB
spring.servlet.multipart.max-request-size=8MB